name: tests

on:
  push:
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: calliope-dashboard-070
          cache-environment: true
      - name: Install dashboard package
        shell: bash -el {0}
        run: python -m pip install --no-deps --editable .
      - name: Run tests
        shell: bash -el {0}
        run: pytest -q
