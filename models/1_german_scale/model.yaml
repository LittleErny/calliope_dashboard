import:
  - model_config/techs.yaml
  - model_config/locations.yaml
  - scenarios.yaml

config:
  init:
    name: Fictional Germany model
    calliope_version: 0.7.0
    subset:
      timesteps: ["2025-07-01", "2025-07-14"]
    broadcast_input_data: true
    distance_unit: m
    mode: base
  build:
    ensure_feasibility: true
  solve:
    solver: cbc
    zero_threshold: 1e-10

data_definitions:
  objective_cost_weights:
    data: [1, 0.1]
    index: [monetary, co2]
    dims: costs
  bigM: 1e8

data_tables:
  time_varying_parameters:
    data: german_timeseries
    rows: timesteps
    columns: [nodes, techs, parameters]
