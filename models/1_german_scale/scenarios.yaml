scenarios:
  operate_fixed: [operate_override]
  high_demand: [high_demand_override]

overrides:
  high_demand_override:
    data_tables.time_varying_parameters.table: german_high_demand_timeseries

  operate_override:
    config:
      init:
        mode: operate
      build:
        operate:
          window: 168h
          horizon: 336h
    nodes:
      Berlin.techs:
        pv.flow_cap: 9520000
        wind.flow_cap: 15470000
        coal.flow_cap: 5525000
        storage: {flow_cap: 100000, storage_cap: 400000}
      Hamburg.techs:
        pv.flow_cap: 3360000
        wind.flow_cap: 4200000
        hydro.flow_cap: 80000
        storage: {flow_cap: 75000, storage_cap: 300000}
      Munich.techs:
        pv.flow_cap: 3570000
        hydro.flow_cap: 136000
        gas.flow_cap: 1606500
        storage: {flow_cap: 100000, storage_cap: 400000}
      Cologne.techs:
        pv.flow_cap: 1338750
        wind.flow_cap: 595000
        coal.flow_cap: 1870000
      Frankfurt.techs:
        pv.flow_cap: 1115625
        gas.flow_cap: 1275000
        storage: {flow_cap: 50000, storage_cap: 200000}
      Leipzig.techs:
        pv.flow_cap: 714000
        wind.flow_cap: 952000
        coal.flow_cap: 1275000
      Hannover.techs:
        pv.flow_cap: 327250
        wind.flow_cap: 595000
        gas.flow_cap: 1020000
        storage: {flow_cap: 40000, storage_cap: 160000}
      Nuremberg.techs:
        pv.flow_cap: 1428000
        hydro.flow_cap: 54400
        gas.flow_cap: 1020000
        storage: {flow_cap: 30000, storage_cap: 120000}
    techs:
      gas_boiler.flow_cap: 4000000
      solar_thermal.flow_cap: 300000
      storage.cyclic_storage: false
      Berlin_to_Leipzig.flow_cap: 800000
      Berlin_to_Hannover.flow_cap: 1000000
      Hannover_to_Hamburg.flow_cap: 900000
      Cologne_to_Frankfurt.flow_cap: 850000
      Frankfurt_to_Nuremberg.flow_cap: 700000
      Leipzig_to_Hannover.flow_cap: 600000
      Munich_to_Nuremberg.flow_cap: 900000
      Cologne_to_Hannover.flow_cap: 750000
