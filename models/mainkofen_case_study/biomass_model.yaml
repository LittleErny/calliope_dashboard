### trial 1
## try storage for pv scenario

model:
  name: "Mainkofen Hospital — biomass scenario"
  timeseries_data_path: "timeseries_data"
  calliope_version: 0.6.10

time:
  resolution: 1H
  # 24 hours to keep it compact; extend freely later
  start: "2023-01-01 00:00"
  end:   "2023-12-31 23:00"

run:
  objective_options:
    cost_class: {monetary: 1}   # ← FIXED
    sense: minimize
  ensure_feasibility: true    # allows unmet penalty if you ever soft-cap
  mode: plan  # perfect-foresight planning
  #solver: gurobi

import:
  - model_config/biomass_tech.yaml
  - model_config/biomass_locations.yaml
  - scenarios.yaml
