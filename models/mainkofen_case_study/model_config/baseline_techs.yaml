techs:
  # --- CARRIERS ---
  # Implicit via techs: electricity, heat, cooling

  # --- DEMAND TECHS ---
  demand_electricity:
    essentials:
      name: "Electricity demand"
      color: "#fc0b03"
      parent: demand
      carrier: electricity

  demand_heat:
    essentials:
      name: "Heat demand"
      color: "#fc0b03"
      parent: demand
      carrier: heat

  # --- SUPPLY / CONVERSION TECHS ---
  grid_electricity:
    essentials:
      name: "Grid import"
      parent: supply
      carrier: electricity
    constraints:
      resource: inf         # unlimited import (baseline)
    costs:
      monetary:
        om_con: 0.28        # €/kWh_e electricity price (all-in baseline)

  biomass:
    essentials:
      name: "Biomass power plant"
      color: "#D800FF"
      parent: conversion_plus
      carrier_in: biomass
      carrier_out: heat
      carrier_out_2: electricity
      primary_carrier_out: heat
    constraints:
      energy_eff: file=biomass_avail_seasonal.csv  #0.80
      carrier_ratios:
        carrier_out_2:
          electricity: 0.225     # 0.18 / 0.80
      lifetime: 30
      # For a fixed electrical capacity of 540 kW, calculate the corresponding 
      # heat input capacity (P_th_in). 
      # P_th_in = P_el_out / eta_el = 540 kW / 0.18 = 3000 kW (If P_el is the constraint)
      # OR: P_th_in = P_heat_out / eta_heat = P_heat_out / 0.80
      # Let's set the *primary* (heat) capacity based on the 540 kW_electricity constraint:
      # P_th_in = 3000 kW. P_heat_out = 3000 kW * 0.80 = 2400 kW.
      energy_cap_max: 3000 # kW (This is the maximum fuel *input* capacity, P_th_in)
      #energy_con: file=biomass_avail_seasonal.csv 
    costs:
      monetary:
        interest_rate: 0.10
        energy_cap: 3758          # CAPEX per kW_th
        om_annual: 75.16          # per kW_th-year
        om_prod: 0.0              # variable O&M per kWh_out (set if needed)
  
  supply_biomass:
    essentials:
      parent: supply
      carrier: biomass
    constraints: # Total wood chips consumed = 5,318.68 tons 
      resource: 23934060 # Total Annual Energy = 5,318.68 tons * 4500 kWh/ton = 23,934,060 kWh/year Or 23,934.06 MWh/year
    costs:
      monetary:
        om_con: 0.02              # €/kWh_fuel
