techs:
  # --- DEMAND TECHS ---
  demand_electricity:
    essentials:
      name: "Electricity demand"
      color: "#fc0b03"
      parent: demand
      carrier: electricity

  # --- SUPPLY / CONVERSION ---
  grid_electricity:
    essentials:
      name: "Grid import"
      parent: supply
      carrier: electricity
    constraints:
      resource: inf
      energy_cap_max: 1000   # kW peak allowed
    costs:
      monetary:
        om_prod: 0.28   # €/kWh_e
 
  # --- pv_rooftops ---
  pv_rooftop_1:
    essentials:
      name: "PV (rooftop)"
      parent: supply
      carrier: electricity
    constraints:
      # A normalized profile (0..1) that scales output by energy_cap
      resource: file=pv_ac_kw_hourly_2023.csv
      resource_unit: energy_per_cap
      energy_cap_equals: 500   # kW installed PV (quick, fixed-capacity scenario)
    costs:
      monetary:
        om_prod: 0.0           # zero marginal cost (capex ignored in this simple run)

  pv_rooftop_2:
    essentials:
      name: "PV (rooftop)"
      parent: supply
      carrier: electricity
    constraints:
      # A normalized profile (0..1) that scales output by energy_cap
      resource: file=pv_ac_kw_hourly_2023.csv
      resource_unit: energy_per_cap
      energy_cap_equals: 500   # kW installed PV (quick, fixed-capacity scenario)
    costs:
      monetary:
        om_prod: 0.0           # zero marginal cost (capex ignored in this simple run)
  
  pv_rooftop_3:
    essentials:
      name: "PV (rooftop)"
      parent: supply
      carrier: electricity
    constraints:
      # A normalized profile (0..1) that scales output by energy_cap
      resource: file=pv_ac_kw_hourly_2023.csv
      resource_unit: energy_per_cap
      energy_cap_equals: 500   # kW installed PV (quick, fixed-capacity scenario)
    costs:
      monetary:
        om_prod: 0.0           # zero marginal cost (capex ignored in this simple run)

  pv_rooftop_4:
    essentials:
      name: "PV (rooftop)"
      parent: supply
      carrier: electricity
    constraints:
      # A normalized profile (0..1) that scales output by energy_cap
      resource: file=pv_ac_kw_hourly_2023.csv
      resource_unit: energy_per_cap
      energy_cap_equals: 500   # kW installed PV (quick, fixed-capacity scenario)
    costs:
      monetary:
        om_prod: 0.0           # zero marginal cost (capex ignored in this simple run)



  # # --- STORAGE ---
  battery_storage:
    essentials:
      name: "Battery (Li-ion)"
      parent: storage
      carrier: electricity
    constraints:
      # Power (kW): charge/discharge limit (inverter size)
      energy_cap_max: 500
      # Energy (kWh): usable capacity
      storage_cap_max: 2000
      # Round-trip ~ (energy_eff)^2  ⇒ 0.949^2 ≈ 0.90
      energy_eff: 0.949
      # Standing loss per hour (fraction of SOC)
      storage_loss: 0.001
      # Initial SOC as a fraction of storage_cap (0..1) in 0.6.x
      storage_initial: 0.5
      # Optional: fix C-rate instead of explicit caps
      # energy_cap_per_storage_cap_equals: 0.25   # 0.25 kW per kWh ⇒ 0.25C
    # Remove om_con — not valid for storage in 0.6.x
    costs:
      monetary: {}
