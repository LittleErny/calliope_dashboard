[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calliope-dashboard"
version = "0.1.0"
description = "Interactive Dash views for Calliope 0.7 model inputs and results"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Mikhail Avrutskii", email = "mikhail.avrutskii@stud.th-deg.de"},
]
dependencies = [
  "calliope>=0.7.0.dev7,<0.8",
  "dash>=3.2,<4",
  "dash-leaflet>=1.0.15,<2",
  "h5netcdf>=1.6,<2",
  "numpy>=1.26,<2",
  "pandas>=2.1,<3",
  "plotly>=6.3,<7",
  "xarray>=2024.3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
calliope-dashboard = "calliope_dashboard._server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "calliope_dashboard*", "helpers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
